name: CI

# Pull requests: every guide must pass the article checks and svelte-check.
on:
  pull_request:

jobs:
  guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix guides && npm run check --prefix guides
