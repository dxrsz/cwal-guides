  - title: The +1 speedlot timing
    steps:
      - at: Leg Enhancements 100%
        or: 7:50
        make: Zealot
        use: true
        instruction: Move out with the +1 speed Zealots
        description: About 8 Zealots, with the Corsairs going for Overlords.
        notes: >-
          Khrane wants 7 or 8 Zealots with +1 and leg speed to arrive at the Zerg natural by
          7:30, so he leaves at about 7:05: at 7:30 the Zerg has just enough Hydras to defend,
          and 30 seconds later it can have a dozen more. PADOTUBE moves out when +1 and leg
          speed finish, which in his build happens together. In the replays leg speed starts at
          about 6:27 and takes about 84 seconds, so it finishes around 7:50, when +1 armor
          starts (the earliest a single Forge is free); the eighth Zealot comes at about 7:30,
          so most players hit around 7:30 to 8:00. Pick the weaker of the natural and the other
          bases and pick off drones and Hydras; the Corsairs kill Overlords meanwhile. Keep the
          Zealots outside the Zerg's reach afterwards so they can hit Hydras from behind, but
          don't let them get trapped. If the Zerg commits to your natural, counterattack its
          base.
        sources:
          - replays:
              players: 380
