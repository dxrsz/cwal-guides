title: Standard Forge FE
matchup: PvZ
tagline: Forge, Nexus, Cannon into Corsairs, +1 speedlots and Templar, branching on what the
  Zerg opens and techs to.
objective: >-
  The standard Protoss answer to Zerg. A Forge walls the natural at 11 supply and the Nexus goes
  down at about 13 with a Cannon right after it (two Cannons first against a 9 pool), so a scout
  and the right Cannon count hold every common Zerg opener except a 4 or 5 pool. Then a
  Stargate, +1 weapons and a Citadel go down, and the first Corsair finds out whether the Zerg
  is going Spire or Hydralisks. Against a Spire the Stargate keeps working and +1 speed Zealots
  hit at about 7:30 with five or six Corsairs on the Overlords. Against Hydras you make only a
  few Corsairs and hold behind Cannons, more Gateways and Storm. In both, the Templar Archives
  gives you a choice: a Dark Templar first, or Storm first with more Gateways. The game then
  grows into an 8-Gateway Zealot, Dragoon and High Templar army on about 52 Probes, with a third
  Nexus near 11:00. In our replay set 585 players open this way against Zerg; the pros among
  them went 331–139 in those games.
