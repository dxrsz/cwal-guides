  - section: Opener
    at: 8 supply
    or: 0:49
    make: Pylon
    description: At the natural, placed for the Forge wall.
    notes: >-
      Send the Probe a little before the 8th Probe pops, at about 42 minerals, so it arrives
      with the money; Khrane mines once with the 6th Probe and walks it over to land on exactly
      100. There is no single correct wall: lay out your own sim-city on each map so it holds
      both Zerglings and a 3-hatch Hydra push.
