title: Standard Forge FE
matchup: PvZ
tagline: Forge, Nexus, Cannon into Corsairs and +1 speedlots that hit the Zerg natural around 7:30.
objective: >-
  The standard Protoss answer to Zerg: wall the natural with a Forge and take the Nexus on about
  14 supply behind one Cannon. With a scout and the right Cannon count it answers every common
  Zerg opener except a 4 or 5 pool. From there the build sets up a timing. A Stargate keeps one
  or two Corsairs scouting and hunting Overlords, the Forge runs +1 weapons, and the Citadel
  gets leg speed, so that 7 or 8 +1 speed Zealots reach the Zerg natural around 7:30, before the
  Hydralisk count gets out of hand. A Templar Archives at about 6:45 and 3 to 4 Gateways mean
  High Templar and Storm follow the Zealots, and the game grows into an 8-Gateway Dragoon,
  Zealot and Templar army on two bases. About 300 players in our replay set, pros included, open
  this way against Zerg, most often against overpool into 3-hatch Spire or 3-hatch Hydra.
