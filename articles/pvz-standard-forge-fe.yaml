  - at: 8 supply
    make: Probe
    use: true
    instruction: Scout with the Pylon Probe
    description: The same Probe goes straight on to find the Zerg.
    notes: >-
      On four-player maps check the clockwise spawn first: a Zerg there can mine faster, so its
      lings reach you soonest and it is the spawn that can punish a 13 Nexus. Turn back as soon
      as you see the creep edge rather than walking in. Park the Probe near the larvae: three
      larvae morphing the same shape at once before the Zerg has scouted is Zerglings, so get
      the Cannon ready. After an overpool the Zerg natural Hatchery goes down at about 2:00; if
      it is not there by then, it is a 9 pool (see the variant at the end). Don't harass the
      drones before the Zerg has 300 minerals for its Hatchery; you gain nothing before then.
      Keep the Probe alive as long as you can for the tech read. Gas but no Hydralisk Den means
      Mutalisks: keep the Corsairs coming and get a Cannon in the main. An early Den means
      Hydras: plan for 4 Cannons at the natural.
    sources:
