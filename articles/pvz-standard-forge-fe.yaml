stages:
  - title: "Opener: Pylon and Forge"
    steps:
      - at: 8 supply
        or: 0:48
        make: Pylon
        description: At the natural, placed for the Forge wall.
        notes: >-
          Send the Probe at about 42 minerals, just before the 8th Probe pops, so it arrives
          with the money; Khrane mines once with the 6th Probe and walks it over to land on 100.
          There is no fixed wall: lay out your own sim-city (the Pylon, Forge, Gateway and
          Cannon placed to close most of the natural's entrance) on each map so it holds both
          Zerglings and a later Hydralisk push. Keep one Pylon building ahead of supply for the
          whole game; the guide lists each one up to the seventh, at about 7:00.
        sources:
          - replays:
              players: 585
              at: 0:48
              range: 0:48-0:50
              supply: 8
              workers: 7
          - youtube: https://youtu.be/ew7GJM2SydM?t=43
            label: "Song Byung-goo (Stork) TV: Forge double Nexus lecture"
          - youtube: https://youtu.be/WFt1reU1cCU?t=70
            label: "Khrane: PvZ FFE into +1/+1 Opening"
          - youtube: https://youtu.be/5wprChZSI-Y?t=45
            label: "PADOTUBE: Forge double lecture, in detail"

      - at: 8 supply
        make: Probe
        use: true
        instruction: Scout with the Pylon Probe
        description: The same Probe goes straight on to find the Zerg.
        notes: >-
          On four-player maps check the clockwise spawn first. A Zerg there can boost its
          mining, so it is the likeliest to overpool or go 11 to 12 hatch. Turn back as soon as
          you see the edge of its creep rather than walking in. Park near the larvae: several
          saved larvae morphing the same shape at once, before the Zerg has scouted, are
          Zerglings. A second Overlord before the pool rules out a 9 pool or anything faster.
          Don't bother the Zerg before it has its 300 minerals for the Hatchery: by then you
          have about the same money, so harassing earlier gains you nothing. What you see here
          is the first choice below.
        sources:
          - replays:
              players: 585
              at: 0:48
              range: 0:48-0:50
              supply: 8
              workers: 7
          - youtube: https://youtu.be/ew7GJM2SydM?t=21
            label: "Song Byung-goo (Stork) TV: Forge double Nexus lecture"
          - youtube: https://youtu.be/5wprChZSI-Y?t=45
            label: "PADOTUBE: Forge double lecture, in detail"
          - youtube: https://youtu.be/kbo2QGOtVIg?t=101
            label: "KhalaTV: Forge double into 8 Gates and 2 Forges vs 3-hatch Hydra"

      - at: 11 supply
        or: 1:33
        make: Forge
        description: At the natural, with the 10th or 11th Probe.
        notes: >-
          Replays put it on 11 and almost never later than 12. Coaches split on a missed scout.
          PADOTUBE sends the 10-supply Probe to the natural and builds on 11 anyway, then scouts
          the other spot, because a later Forge can lose to a 4, 5 or 9 pool. KhalaTV builds on
          12 when he can't see the Zerg main, as long as a second Overlord has already ruled out
          a 9 pool or faster. The guide goes with 11. Against a hatch first, keep the Forge;
          don't cancel it. A 4 or 5 pool (lings at your natural before the Forge is done)
          basically can't be held with this opener; get a Cannon down the moment the Forge
          finishes, fight with Probes, and accept losing some. Probes never stop: about 10 when
          the Forge goes down and 12 at 2:00. No gas and no Gateway yet, and no army but your
          Probes: this stage is about holding, not attacking.
        sources:
          - replays:
              players: 585
              at: 1:33
              range: 1:30-1:38
              supply: 11
              workers: 10
              note: "Forge #1"
          - youtube: https://youtu.be/WFt1reU1cCU?t=114
            label: "Khrane: PvZ FFE into +1/+1 Opening"
          - youtube: https://youtu.be/ew7GJM2SydM?t=65
            label: "Song Byung-goo (Stork) TV: Forge double Nexus lecture"
          - youtube: https://youtu.be/5wprChZSI-Y?t=145
            label: "PADOTUBE: Forge double lecture, in detail"

  - title: Against the Zerg opener
    choose: What did your Probe scout see?
    options:
      - id: vs-overpool
        label: "Overpool"
        read: >-
          A second Overlord before the pool, and the Zerg natural Hatchery going down at about
          2:00. A 12 pool plays the same way: the second Overlord first, then the pool, and no
          natural yet. The Overlord coming before the pool is what tells it apart from a 9 pool.
        steps:
          - at: 13 supply
            or: 2:02
            make: Probe
            use: true
            instruction: Cut Probes at 13 for the Nexus
            description: Stop at 13 Probes for about 35 seconds while you save for the Nexus and Cannon.
            notes: >-
              Nearly every player cuts here. Khrane makes the Probe cut on purpose against an
              overpool and sends the builder at 250 minerals. Start Probes again as the Nexus
              goes down.
            sources:
              - replays:
                  players: 359
                  at: 2:02
                  range: 2:00-2:15
                  note: Worker Pause@14, vs Overpool
              - youtube: https://youtu.be/WFt1reU1cCU?t=155
                label: "Khrane: PvZ FFE into +1/+1 Opening"

          - at: 13 supply
            or: 2:13
            make: Nexus
            description: The natural Nexus. Probes start again as it goes down.
            notes: >-
              The coaches' 13 Nexus. Khrane sends the builder at 250 minerals so it arrives as
              you reach 400. On Eclipse, after a 12 Forge, KhalaTV says 14 Nexus and 14 Cannon
              also works. This is your second base; the third waits until about 11:00, behind 8
              Gateways.
            sources:
              - replays:
                  players: 364
                  at: 2:13
                  range: 2:11-2:19
                  supply: 13
                  workers: 13
                  note: "Nexus #1, vs Overpool"
              - replays:
