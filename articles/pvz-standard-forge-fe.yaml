              - youtube: https://youtu.be/5wprChZSI-Y?t=294
                label: "PADOTUBE: Forge double lecture, in detail"
              - youtube: https://youtu.be/xcPC_BqNiFw?t=119
                label: "BISUTUBE: Bisu's Forge double for PvZ"

          - at: 15 supply
            or: 2:46
            make: Gateway
            description: At the natural, completing the wall.
            notes: >-
              This is your only Gateway until about 6:00 to 6:30, depending on the Templar line.
              Keep watching the Zerg while it goes up. If drones come out of the larvae after
              the lings leave, it made only six lings and you can play comfortably. Six lings
              plus gas means ling speed is coming, so keep a unit placed for lings that run past
              the Cannon. Four lings chasing your Probe may be a bluff hiding a Hydra or Lair
              follow-up, but if the Zerg also left two main larvae unused it can still be a ling
              all-in, so watch the natural entrance.
            sources:
