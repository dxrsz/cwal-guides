stages:
  - title: "Opener: Pylon and Forge"
    steps:
      - at: 8 supply
        or: 0:48
        make: Pylon
        description: At the natural, placed for the Forge wall.
        notes: >-
          Send the Probe at about 42 minerals, just before the 8th Probe pops, so it arrives
          with the money; Khrane mines once with the 6th Probe and walks it over to land on
          exactly 100. There is no fixed wall: lay out your own sim-city on each map so it holds
          both Zerglings and a later Hydralisk push.
        sources:
          - replays:
              players: 456
              at: 0:48
              range: 0:48-0:50
              supply: 8
              workers: 7
          - youtube: https://youtu.be/ew7GJM2SydM?t=799
            label: "Song Byung-goo (Stork) TV: Forge double Nexus lecture"
          - youtube: https://youtu.be/WFt1reU1cCU?t=70
            label: "Khrane: PvZ FFE into +1/+1 Opening"
          - youtube: https://youtu.be/5wprChZSI-Y?t=45
            label: "PADOTUBE: Forge double lecture, in detail"

      - at: 8 supply
        make: Probe
        use: true
        instruction: Scout with the Pylon Probe
        description: The same Probe goes straight on to find the Zerg.
        notes: >-
          On four-player maps check the clockwise spawn first. A Zerg there can boost its
          mining, so its early lings may beat a 13 Nexus and Cannon, and Zergs at that spot also
          often go hatch first, which lets you put the Nexus down first. Turn back as soon as
          you see the edge of its creep rather than walking in. Park near the larvae: three
          larvae morphing the same shape at once, before the Zerg has scouted, are Zerglings. A
          second Overlord before the pool rules out a 9 pool or anything faster. Don't bother
          the Zerg before it has its 300 minerals for the Hatchery: by then you have about the
          same money, so harassing earlier gains you nothing. What you see here is the first
          choice below.
        sources:
          - replays:
              players: 456
              at: 0:48
              range: 0:48-0:50
              supply: 8
              workers: 7
          - youtube: https://youtu.be/ew7GJM2SydM?t=21
            label: "Song Byung-goo (Stork) TV: Forge double Nexus lecture"
          - youtube: https://youtu.be/WFt1reU1cCU?t=93
            label: "Khrane: PvZ FFE into +1/+1 Opening"
          - youtube: https://youtu.be/5wprChZSI-Y?t=45
            label: "PADOTUBE: Forge double lecture, in detail"

      - at: 11 supply
        or: 1:33
        make: Forge
        description: At the natural, with the 10th or 11th Probe.
        notes: >-
          Replays put it on 11 and almost never later than 12. If the first scout missed, send
          the 10-supply Probe to the natural and build on 11 anyway, then scout the other spot:
          a later Forge loses to a fast pool. Against an overpool you have already found, a 12
          Forge is fine. Against a hatch first, keep the Forge; don't cancel it. A 4 or 5 pool
          (lings at your natural before the Forge is done) basically can't be held with this
          opener, PADOTUBE says. The on-time Forge is the only insurance: get a Cannon down the
          moment it finishes, fight with Probes, and accept losing some.
        sources:
          - replays:
              players: 456
              at: 1:33
              range: 1:30-1:38
              supply: 11
              workers: 10
          - youtube: https://youtu.be/WFt1reU1cCU?t=114
            label: "Khrane: PvZ FFE into +1/+1 Opening"
          - youtube: https://youtu.be/ew7GJM2SydM?t=65
            label: "Song Byung-goo (Stork) TV: Forge double Nexus lecture"
          - youtube: https://youtu.be/esOAfXH7Xy4?t=100
            label: "Jung Yoon Jong: Forge double Nexus vs Zerg"

  - title: Against the Zerg opener
    choose: What did your Probe scout see?
    options:
      - id: vs-overpool
        label: Overpool (Overlord, then the pool)
        read: >-
          A second Overlord before the pool, and the Zerg natural Hatchery going down at about
          2:00. A 12 pool plays the same way: the second Overlord first, then the pool and an
          Extractor together at about 12 supply, and no natural yet. The Extractor and the
          Overlord before the pool are what tell it apart from a 9 pool.
        steps:
          - at: 13 supply
            or: 2:14
            make: Nexus
            description: The natural Nexus, with a short Probe cut to afford it.
            notes: >-
              The coaches' 13 Nexus. Khrane sends the builder at 250 minerals so it arrives as
              you reach 400. On a short rush distance, or after a 12 Forge, 14 Nexus and 14
              Cannon is also fine.
            sources:
              - replays:
                  players: 280
                  at: 2:14
                  range: 2:11-2:20
                  supply: 13
                  workers: 13
                  note: vs Overpool
              - youtube: https://youtu.be/WFt1reU1cCU?t=155
                label: "Khrane: PvZ FFE into +1/+1 Opening"
              - youtube: https://youtu.be/xcPC_BqNiFw?t=99
                label: "BISUTUBE: Bisu's Forge double for PvZ"
              - youtube: https://youtu.be/kbo2QGOtVIg?t=139
                label: "KhalaTV: Forge double into a 2-Forge long game"

          - at: 13 supply
            or: 2:23
            make: Photon Cannon
            description: Right after the Nexus, then Probes up to 15.
            notes: >-
              The tightest window of the build is until this Cannon finishes: if the first lings
              arrive, body-block the wall gap with a Probe. Coaches split on six lings. Bisu
              puts a second Cannon down at once, while Stork goes Gateway off one Cannon: if
              lings run past it into the mineral line he pulls Probes and fights, and losing
              about 3 is fine because the Cannon you saved keeps your tech ahead. KhalaTV takes
              a second Cannon or a quick Zealot. Pros mostly play it like Stork: against
              overpool their second Cannon only comes around 5:25. Lings that sit outside the
              natural are fine; lings that vanish may be heading in, so watch the minimap.
              Against a 12 pool the pros add the second Cannon at about 4:25 and build Cannons
              more heavily after that.
            sources:
              - replays:
