      10-supply Probe to the natural, build the Forge on 11 anyway, then scout the other spot: a
      12-13 Forge after a late scout loses to fast pools. Against an overpool found on the first
      try a 12 Forge is fine. A 4 or 5 pool is basically not holdable with this opener.
