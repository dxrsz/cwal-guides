title: Standard Forge FE
matchup: PvZ
tagline: Forge, Nexus, Cannon into Corsairs, +1 speedlots and Templar, branching on what the
  Zerg opens and techs to.
objective: >-
  The standard Protoss answer to Zerg. A Forge walls the natural at 11 supply and the Nexus goes
  down at about 13 to 14 behind a Cannon, so a scout and the right Cannon count hold every
  common Zerg opener except a 4 or 5 pool. The Probe scout decides the first fork: against an
  overpool play the standard order, against a 9 pool put two Cannons down before the Nexus, and
  against a hatch first take the Nexus early and the Cannon late. Then a Stargate, +1 weapons
  and a Citadel go down, and the first Corsair finds out whether the Zerg is going Spire or
  Hydralisks. Against a Spire the Stargate keeps working; against Hydras you stop at a Corsair
  or two and build Cannons and Gateways instead. A Templar Archives at about 6:15 to 6:45 gives
  you a choice between a Dark Templar with Corsairs before Storm, or Storm first with more
  Gateways. Either way +1 speed Zealots pressure around 7:30 to 8:00 while High Templar come out
  behind them, and the game grows into an 8-Gateway Zealot, Dragoon and Templar army with a
  third Nexus around 11:00. In our replay set 456 players open this way against Zerg; the pros
  among them went 239–103 in those games.
