                  range: 8:34-9:56
                  supply: 84
                  workers: 51
                  note: "Gateway #8, vs Overpool"
              - youtube: https://youtu.be/WFt1reU1cCU?t=155
                label: "Khrane: PvZ FFE into +1/+1 Opening"
              - youtube: https://youtu.be/xcPC_BqNiFw?t=99
                label: "BISUTUBE: Bisu's Forge double for PvZ"
              - youtube: https://youtu.be/kbo2QGOtVIg?t=139
                label: "KhalaTV: Forge double into 8 Gates and 2 Forges vs 3-hatch Hydra"

          - at: next
            or: 2:23
            make: Photon Cannon
            description: Right after the Nexus, still at 13 supply; then Probes up to 15.
            notes: >-
              The tightest window of the build is until this Cannon finishes: if the first lings
              arrive, body-block the wall gap with a Probe. Coaches split on six lings. Bisu
              puts a second Cannon down at once, while Stork goes Gateway off one Cannon: if
              lings run past it into the mineral line he pulls Probes and fights, and losing
              about 3 is fine because the Cannon you saved keeps your tech ahead. KhalaTV (in a
              12-hatch game) counts the lings: against six or more, two Cannons or a quick
              Zealot; against about four, Core first. Pros mostly play it like Stork: against
              overpool their second Cannon only comes around 5:40. Lings that sit outside the
              natural are fine; lings that vanish may be heading in, so watch the minimap.
              Against a 12 pool the pros add the second Cannon at about 4:50.
            sources:
              - replays:
                  players: 364
                  at: 2:23
                  range: 2:20-2:27
                  supply: 13
                  workers: 13
                  note: "Photon Cannon #1, vs Overpool"
              - replays:
                  players: 341
                  at: 5:37
                  range: 5:06-6:07
                  supply: 42
                  workers: 32
                  note: "Photon Cannon #2, vs Overpool"
