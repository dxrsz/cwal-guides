      - id: vulture-allin
        label: Stay all-in
        read: >-
          Their natural is open, with no sieged Tank in front of it, and your Vultures are
          killing SCVs: keep going instead of expanding. This rests on a handful of single
          replays, not a group: against a fast expand, 6 of the 16 mass-Vulture players stayed
          on one base (one dropped a late Command Center at about 8:10). The 2 pros among them,
          Artosis and Skey, both won, and all 6 games were over by about 9:45.
        steps:
          - at: 5:10
            make: Vulture
            instruction: Skip the Command Center and keep both Factories on Vultures
            description: No Command Center and no more production; every Vulture goes to the fight and SCVs
              stay stopped. Artosis had about 24, Skey 17.
            notes: >-
              The minerals a Command Center would cost are the Vultures doing the damage, and
              the window closes once their Tanks are sieged at the natural. Spend on Vultures
              and Depots only.
            sources:
              - replay: https://cwal.gg/viewer?match=MM-D16D55F0-B87E-11F1-8CDB-FA167A6BEE7E
                label: Example replay
              - replay: https://cwal.gg/viewer?match=MM-56B7595E-C248-11F1-A71E-FA167AEAB62F
                label: Example replay
              - youtube: https://youtu.be/QQAOhCkl8Lg?t=130
                label: Day9TV

          - at: next
            make: 2 Supply Depot
            description: Keep Depots ahead; Artosis put down two at once as his eighth Vulture started.
            sources:
              - replay: https://cwal.gg/viewer?match=MM-D16D55F0-B87E-11F1-8CDB-FA167A6BEE7E
                label: Example replay
              - youtube: https://youtu.be/zFpTLY4Pgpk?t=473
                label: 흑운장TV

          - at: 5:15
            make: Vulture
            use: true
            instruction: Mine their natural and mineral lines
            description: Lay Mines inside and around their natural, where their SCVs and units walk.
            notes: >-
              Mines planted close to their base give vision and stop them moving out. Both pro
              games ended before 6:00. Day9's caution applies: staying on one base delays your
              own expansion, so a harass that is held only gets you back to even. If their Tanks
              are sieged at the natural and your Vultures have stopped killing SCVs, the all-in
              has stalled, and none of these replays shows a one-base game recovering from
              there.
            sources:
              - replay: https://cwal.gg/viewer?match=MM-D16D55F0-B87E-11F1-8CDB-FA167A6BEE7E
                label: Example replay
              - replay: https://cwal.gg/viewer?match=MM-56B7595E-C248-11F1-A71E-FA167AEAB62F
