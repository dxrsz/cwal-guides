title: TvT 2 Factory
matchup: TvT
tagline: One Barracks, gas and two Factories by 3:05, then a Tank push, mass Vultures or
  Vulture-Goliath into the natural.
objective: >-
  An aggressive one-base TvT opener aimed at the Terran who expands early: Depot, Barracks, gas,
  a Marine or two and two Factories by about 3:05. As the first Factory finishes, at about 3:20,
  you pick the attack: a three-Tank push with Vultures and Mines, mass Vultures with speed and
  Mines (5–1 in 6 pro games), or an early Armory into Goliaths, which expands earliest of the
  three lines (about 5:36). After a Tank push, expand: the pros who stayed on one base went 0–4.
  Against an opponent who stays on one base himself, hold with Vultures, Goliaths and a Comsat,
  then expand.
references:
  - youtube: https://www.youtube.com/watch?v=QWkLvhLh0dg
    label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"
  - replay: https://cwal.gg/viewer?match=MM-17C3C25A-BD2F-11F1-A71E-FA167AEAB62F
    label: "Artosis vs fast expand: Tank push, then expand (win, closest to the consensus)"
  - replay: https://cwal.gg/viewer?match=MM-DCF53178-BA67-11F1-B3A2-FA167B99164A
    label: "Light vs fast expand: Tank push (win)"
  - replay: https://cwal.gg/viewer?match=MM-DDE5B544-BB98-11F1-A71E-FA167AEAB62F
    label: "Artosis vs fast expand: mass Vultures, then expand (win)"
  - replay: https://cwal.gg/viewer?match=MM-D16D55F0-B87E-11F1-8CDB-FA167A6BEE7E
    label: "Artosis vs fast expand: one-base Vulture all-in (win)"
  - replay: https://cwal.gg/viewer?match=MM-6FBCD540-BE02-11F1-A71E-FA167AEAB62F
    label: "Prime vs one-base tech: Vulture-Goliath, then expand"

stages:
  - title: "Opener: Barracks, gas, two Factories"
    steps:
      - at: 9 supply
        or: 0:56
        make: Supply Depot
        description: The usual first Depot; at the top of your ramp if you want a wall.
        notes: >-
          A wall at the main ramp makes the build more comfortable, but Lee Sung-eun plays it
          without one and says you don't need to force it. If your minerals sit to the right of
          the Command Center, a Depot placed against it shortens the SCVs' trips. SCVs go
          nonstop until the 15th, at 16 supply. This guide lists every Depot up to the fourth,
          at about 4:25; after that, keep one building ahead of supply.
        sources:
          - replays:
              players: 103
              at: 0:56
              range: 0:55-0:58
              supply: 9
              workers: 8
              note: "Supply Depot #1"
          - replays:
              players: 78
              at: 2:28
              range: 2:24-2:45
              note: Worker Pause@16
          - replays:
              players: 97
              at: 4:22
              range: 4:06-4:43
              supply: 29
              workers: 20
              note: "Supply Depot #4"
          - youtube: https://youtu.be/QWkLvhLh0dg?t=41
            label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"
          - youtube: https://youtu.be/zFpTLY4Pgpk?t=50
            label: 흑운장TV

      - at: 11 supply
        or: 1:28
        make: Barracks
        description: Barracks at 11, as in the video and in every replay.
        notes: >-
          The Barracks is only there for a Marine or two and to unlock the Factory. Marines are
          never massed in TvT, because Tanks beat them; the Barracks usually lifts off later to
          scout.
        sources:
          - replays:
              players: 103
              at: 1:27
              range: 1:25-1:29
              supply: 11
              workers: 10
          - youtube: https://youtu.be/QWkLvhLh0dg?t=84
            label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"
          - youtube: https://youtu.be/QQAOhCkl8Lg?t=1520
            label: Day9TV

      - at: 12 supply
        or: 1:39
        make: Refinery
        description: Gas next, about 17 seconds after the Depot finishes.
        notes: >-
          The video says 11; nearly every replay has it on 12. Put three SCVs on it as it
          finishes. This is your only gas until the natural is up.
        sources:
          - replays:
              players: 103
              at: 1:38
              range: 1:36-1:41
              supply: 12
              workers: 11
              note: "Refinery #1"
          - replays:
              players: 51
              at: 7:56
              range: 7:19-8:33
              supply: 47
              workers: 29
              note: "Refinery #2"
          - youtube: https://youtu.be/QWkLvhLh0dg?t=84
            label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

      - at: 14 supply
        make: SCV
        use: true
        instruction: Scout with an SCV
        description: Send it at 14 while gas is mining.
        notes: >-
          In their main, look at the Barracks: does it keep making Marines, or lift off early?
          Then get out before it is trapped and wait outside their natural. A Command Center
          there, or a forward Barracks that lifts off after being scouted, means they are
          expanding; no Command Center and a second Factory or a Starport means one-base tech.
          That is the first choice below. Keep the SCV alive: you will want it again. If instead
          you find two or more Barracks, or nothing at all in their main (a proxy), the replays
          have almost no games to go on: make the second Marine, add a Bunker by your mineral
          line, and take a Vulture before the Machine Shop. Lee Sung-eun holds an early Vulture
          with a Bunker, three Marines and pulled SCVs.
        sources:
          - youtube: https://youtu.be/QWkLvhLh0dg?t=105
            label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"
          - youtube: https://youtu.be/zFpTLY4Pgpk?t=159
            label: 흑운장TV
          - youtube: https://youtu.be/QQAOhCkl8Lg?t=1520
            label: Day9TV

      - at: Barracks 100%
        or: 2:20
        make: Marine
        description: One Marine as the Barracks finishes; 9 in 10 players make it.
        sources:
          - replays:
              players: 94
              at: 2:20
              range: 2:18-2:24
              supply: 16
              workers: 14
          - youtube: https://youtu.be/QWkLvhLh0dg?t=129
            label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

      - at: 16 supply
        or: 2:21
        make: Supply Depot
        description: The second Depot, about a minute after the first finished.
        sources:
          - replays:
              players: 103
              at: 2:21
              range: 2:18-2:33
              supply: 16
              workers: 14
              note: "Supply Depot #2"

      - at: 16 supply
        or: 2:28
        make: SCV
        use: true
        instruction: Cut SCVs at 16 supply for the Factory
        description: With 15 SCVs, about 25 seconds without SCVs while the Factory and second Marine go
          down.
        notes: >-
          Three in four players take this short cut. Start SCVs again as soon as the Factory is
          placed.
        sources:
          - replays:
              players: 78
              at: 2:28
              range: 2:24-2:45
              note: Worker Pause@16

      - id: fact1
        at: Refinery 100%
        or: 2:30
        make: Factory
        description: The first Factory, about 25 seconds after the Refinery finishes.
        notes: >-
          Build it the moment you can afford it, as the video does. Its finishing, at about
          3:20, is when you pick the attack in the next stages.
        sources:
          - replays:
              players: 103
              at: 2:30
              range: 2:28-2:33
              supply: 16
              workers: 15
              note: "Factory #1"
          - replays:
              players: 52
              at: 3:27
              range: 3:21-3:43
              supply: 21
              workers: 18
              note: "Machine Shop #1, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                Tank-Vulture push line"
          - replays:
              players: 101
              at: 3:30
              range: 3:20-4:02
              supply: 23
              workers: 18
              note: "Vulture #1"
          - youtube: https://youtu.be/QWkLvhLh0dg?t=129
            label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

      - at: 18 supply
        or: 2:40
        make: Marine
        description: A second Marine; about 3 in 4 players make it, 1 in 3 a third.
        notes: >-
          Half of the mass-Vulture players skip this one. Two Marines and SCVs are all the
          defence you have until the first Vulture, which is fine: there is nothing to attack
          yet, so stay home.
        sources:
          - replays:
              players: 78
              at: 2:40
              range: 2:36-2:46
              supply: 18
              workers: 15
              note: "Marine #2"
          - replays:
              players: 37
              at: 3:16
              range: 2:59-3:35
              supply: 21
              workers: 17
              note: "Marine #3"
          - replays:
              players: 8
              at: 2:44
              range: 2:35-2:51
              supply: 19
              workers: 16
              note: "Marine #2, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory mass
                Vulture line"
          - youtube: https://youtu.be/QQAOhCkl8Lg?t=1520
            label: Day9TV

      - at: Factory 68%
        or: 3:05
        make: Factory
        description: Second Factory, two-thirds of the way into the first. About 17 SCVs.
        notes: >-
          Lee Sung-eun builds it as his scout leaves their main. Everyone on every line builds
          it here; the lines split in the next half-minute, as the first Factory finishes.
        sources:
          - replays:
              players: 103
              at: 3:05
              range: 2:57-3:13
              supply: 19
              workers: 17
              note: "Factory #2"
          - replays:
              players: 52
              at: 3:04
              range: 2:57-3:11
              supply: 19
              workers: 17
              note: "Factory #2, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                Tank-Vulture push line"
          - replays:
              players: 16
              at: 3:02
              range: 2:55-3:06
              supply: 18
              workers: 17
              note: "Factory #2, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory mass
                Vulture line"
          - replays:
              players: 17
              at: 3:05
              range: 3:00-3:15
              supply: 19
              workers: 17
              note: "Factory #2, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                Vulture-Goliath into expansion"
          - youtube: https://youtu.be/QWkLvhLh0dg?t=174
            label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

  - title: Against their opener
    choose: What did your scout see?
    options:
      - id: vs-fast-expand
        label: Fast expand
        read: >-
          A Command Center at their natural by about 3:00, or a forward Barracks that lifts off
          after being scouted (the CC follows). 1 Factory expand and CC first both count. This
          is by far the common case: 86 of the 103 players faced it.
        steps:
          - at: 3:15
            make: SCV
            use: true
            instruction: Watch their natural until the Command Center goes down
            description: Then park the SCV somewhere safe and pick the attack.
            notes: >-
              An expanding Terran with one Marine has a weak Bunker, which is why the push below
              works even if he has seen your Factories. The attack is picked as the first
              Factory finishes, at about 3:20: a Machine Shop first means the Tank push; a
              Vulture first means mass Vultures or the Goliath line. In the replays 52 players
              went Tank push, 16 mass Vultures and 17 Vulture-Goliath into the natural.
            sources:
              - replays:
                  players: 52
                  at: 3:27
                  range: 3:21-3:43
                  supply: 21
                  workers: 18
                  note: "Machine Shop #1, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line"
              - replays:
                  players: 13
                  at: 3:27
                  range: 3:22-4:25
                  supply: 21
                  workers: 18
                  note: "Machine Shop #1, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    mass Vulture line"
              - replays:
                  players: 17
                  at: 3:21
                  range: 3:20-3:24
                  supply: 22
                  workers: 18
                  note: "Vulture #1, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Vulture-Goliath into expansion"
              - replays:
                  players: 17
                  at: 3:32
                  range: 3:30-3:45
                  supply: 23
                  workers: 18
                  note: "Armory #1, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Vulture-Goliath into expansion"
              - youtube: https://youtu.be/QWkLvhLh0dg?t=174
                label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

      - id: vs-one-base
        label: One-base tech
        read: >-
          No Command Center at their natural by about 3:15, and their Barracks stays home. They
          are teching on one base: a second Factory, a Starport (1-1-1, Wraiths) or Tanks off
          one Factory. 15 of the 103 players faced this.
        steps:
          - at: 3:15
            make: SCV
            use: true
            instruction: No natural seen; keep the scout alive
            description: Pull it back to somewhere safe; it goes into their main again at about 4:00.
            sources:
              - youtube: https://youtu.be/QWkLvhLh0dg?t=174
                label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

  - title: The attack
    when: [ vs-fast-expand ]
    choose: Tanks, Vultures or Goliaths?
    options:
      - id: tank-push
        label: Tank push
        read: >-
          Your call as the first Factory finishes (about 3:20): the Machine Shop goes on before
          any Vulture. The standard line, 52 of 86 players against an expansion; pros went 5–5.
        steps:
          - at: Factory 100% @fact1
            or: 3:27
            make: Machine Shop
            description: Machine Shop on the first Factory the moment it finishes.
            sources:
              - replays:
                  players: 52
                  at: 3:27
                  range: 3:21-3:43
                  supply: 21
                  workers: 18
                  note: vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory Tank-Vulture push
                    line

          - at: 22 supply
            or: 3:31
            make: Supply Depot
            description: The third Depot, after the second Factory. About 19 SCVs at 4:00.
            notes: >-
              The video builds this Depot right after the second Factory.
            sources:
              - replays:
                  players: 52
                  at: 3:31
                  range: 3:27-3:40
                  supply: 22
                  workers: 18
                  note: "Supply Depot #3, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line"
              - youtube: https://youtu.be/QWkLvhLh0dg?t=219
                label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

          - at: Machine Shop 100%
            or: 3:54
            make: Siege Tank
            description: The first Tank as the Machine Shop finishes.
            notes: >-
              Their first Vulture tends to show up around now; keep it off your SCVs with the
              Marines and the Tank.
            sources:
              - replays:
                  players: 52
                  at: 3:53
                  range: 3:47-4:10
                  supply: 26
                  workers: 20
                  note: vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory Tank-Vulture push
                    line
              - youtube: https://youtu.be/QWkLvhLh0dg?t=219
                label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

          - at: 25 supply
            or: 3:57
            make: Vulture
            description: A Vulture from the second Factory as it finishes.
            sources:
              - replays:
                  players: 50
                  at: 3:56
                  range: 3:23-4:24
                  supply: 25
                  workers: 18
                  note: vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory Tank-Vulture push
                    line

          - at: next
            or: 4:15
            make: SCV
            use: true
            instruction: Cut SCVs at 21
            description: About 35 seconds without SCVs while Tank 2, a Depot and Siege Mode go down.
            notes: >-
              Nearly 9 in 10 players take this cut. About 23 SCVs on one base is where the push
              line sits until it expands.
            sources:
              - replays:
                  players: 45
                  at: 4:15
                  range: 3:54-4:49
                  note: Worker Pause@22, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line

          - at: Siege Tank 100%
            or: 4:26
            make: Siege Tank
            description: The second Tank.
            sources:
              - replays:
                  players: 52
                  at: 4:26
                  range: 4:20-4:37
                  supply: 29
                  workers: 21
                  note: "Siege Tank #2, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line"

          - at: 29 supply
            or: 4:26
            make: Supply Depot
            description: The fourth Depot, with the second Tank. Build it ahead, as the video says.
            notes: >-
              From here keep one Depot building ahead of supply; the next comes at about 38
              supply.
            sources:
              - replays:
                  players: 50
                  at: 4:25
                  range: 4:10-4:42
                  supply: 29
                  workers: 20
                  note: "Supply Depot #4, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line"
              - replays:
                  players: 52
                  at: 4:26
                  range: 4:20-4:37
                  supply: 29
                  workers: 21
                  note: "Siege Tank #2, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line"
              - replays:
                  players: 45
                  at: 5:30
                  range: 5:07-6:18
                  supply: 38
                  workers: 23
                  note: "Supply Depot #5, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line"
              - youtube: https://youtu.be/QWkLvhLh0dg?t=263
                label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

          - at: next
            or: 4:28
            make: Tank Siege Mode
            description: Siege Mode, right after the second Tank.
            notes: >-
              Lee Sung-eun's TvT lecture says to only advance and threaten until Siege Mode is
              done, then push the line forward. The 2 Factory video itself starts walking out at
              about 5:28 with three Tanks and only sieges partway through the push.
            sources:
              - replays:
                  players: 50
                  at: 4:27
                  range: 4:03-4:55
                  supply: 28
                  workers: 20
                  note: Tank Siege Mode, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line
              - replays:
                  players: 52
                  at: 4:26
                  range: 4:20-4:37
                  supply: 29
                  workers: 21
                  note: "Siege Tank #2, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line"
              - youtube: https://youtu.be/zFpTLY4Pgpk?t=500
                label: 흑운장TV
              - youtube: https://youtu.be/QWkLvhLh0dg?t=328
                label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

          - at: Siege Tank 100%
            or: 4:56
            make: Siege Tank
            instruction: Keep both Factories busy
            description: The third Tank. Tanks off the Machine Shop, Vultures from the second Factory.
            notes: >-
              Players keep the Tank Factory busy most of the time and make about 4 Tanks by
              5:20, then switch to Vultures or Goliaths. Three Tanks is the number the video
              pushes with.
            sources:
              - replays:
                  players: 51
                  at: 4:56
                  range: 4:40-5:40
                  supply: 34
                  workers: 22
                  note: "Siege Tank #3, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line"
              - replays:
                  players: 52
                  at: 3:53
                  range: 3:47-4:10
                  note: Siege Tank production, vs TvT fast expand (1 Factory expand or CC first), with TvT 2
                    Factory Tank-Vulture push line
              - replays:
                  players: 44
                  at: 5:38
                  range: 5:12-6:30
                  supply: 37
                  workers: 23
                  note: "Siege Tank #4, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line"
              - youtube: https://youtu.be/QWkLvhLh0dg?t=328
                label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

          - at: 5:02
            make: Machine Shop
            description: The second Machine Shop, on the second Factory, after the early Tanks.
            notes: >-
              The video seems to add it after two Tanks. The players who go on to expand add it
              at about 5:00, after the third Tank; across all Tank-push players the median is
              earlier, about 4:12, with a wide spread.
            sources:
              - replays:
                  players: 27
                  at: 5:02
                  range: 4:05-6:45
                  supply: 31
                  workers: 22
                  note: "Machine Shop #2, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line, with TvT 2 Factory expand behind the push"
              - replays:
                  players: 30
                  at: 4:58
                  range: 4:41-5:36
                  supply: 34
                  workers: 22
                  note: "Siege Tank #3, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line, with TvT 2 Factory expand behind the push"
              - replays:
                  players: 47
                  at: 4:12
                  range: 3:57-5:30
                  supply: 27
                  workers: 20
                  note: "Machine Shop #2, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line"
              - youtube: https://youtu.be/QWkLvhLh0dg?t=263
                label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

          - at: 5:05
            make: Spider Mines
            instruction: Research Spider Mines
            description: Mines once you have 100 gas spare, after the second Tank; 60% get them.
            notes: >-
              The video starts Mines as soon as 100 gas is banked. Speed is rarer on this line
              (under half get Ion Thrusters, later).
            sources:
              - replays:
                  players: 31
                  at: 5:05
                  range: 4:52-6:02
                  supply: 34
                  workers: 22
                  note: Spider Mines, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line
              - replays:
                  players: 24
                  at: 5:38
                  range: 4:46-7:16
                  supply: 35
                  workers: 22
                  note: Ion Thrusters, vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory
                    Tank-Vulture push line
              - youtube: https://youtu.be/QWkLvhLh0dg?t=263
                label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

          - at: 5:06
            make: Armory
            description: An Armory, in case they went Starport. 9 in 10 build it.
            notes: >-
              Lee Sung-eun adds it as a follow-up to the push; seeing Factories rather than a
              Starport in their base means Goliaths can wait.
            sources:
              - replays:
                  players: 47
                  at: 5:06
                  range: 4:12-5:51
                  supply: 33
                  workers: 22
                  note: vs TvT fast expand (1 Factory expand or CC first), with TvT 2 Factory Tank-Vulture push
                    line
              - youtube: https://youtu.be/QWkLvhLh0dg?t=308
                label: "흑운장TV (Lee Sung-eun): 2 Factory Tank-Vulture in TvT"

          - at: Tank Siege Mode 100%
            make: Siege Tank
            use: true
            instruction: Move out with 3 Tanks, Vultures and Mines
            description: Walk slowly toward their natural, laying Mines as you go.
            notes: >-
              Hotkey both Factories so you keep producing while you move. Push in slowly with
              the three Tanks and the Vultures, Mine the ground in front of you, focus fire
              their Tank, then siege up and Mine inside their position. Vultures soaking Tank
              shots let your few Tanks beat more; what counts in TvT is Tanks lost and killed.
